name: notraffic
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: notraffic
      POSTGRES_USER: notraffic
      POSTGRES_PASSWORD: notraffic-local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notraffic -d notraffic"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://notraffic:notraffic-local@postgres:5432/notraffic
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    profiles: [test]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: notraffic_test
      POSTGRES_USER: notraffic
      POSTGRES_PASSWORD: notraffic-local
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notraffic -d notraffic_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
